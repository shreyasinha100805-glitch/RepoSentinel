version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEMO_MODE=false
      - GEMINI_MODEL=gemini-1.5-flash
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=reposentinel
      - MONGODB_COLLECTION=scans
    volumes:
      - ./demo-repository:/app/demo-repository
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongodb-data:
